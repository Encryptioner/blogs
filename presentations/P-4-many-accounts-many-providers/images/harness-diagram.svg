<svg viewBox="0 0 380 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram: two terminal identities, ac1 and ac2, each with their own config directory and provider, both reading the same shared context files">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dotgrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="380" height="210" rx="10" fill="#0D1117"/>
  <rect x="0" y="0" width="380" height="210" rx="10" fill="url(#dotgrid)"/>
  <rect x="0.5" y="0.5" width="379" height="209" rx="10" fill="none" stroke="#30363D"/>

  <!-- window ac1 -->
  <g>
    <rect x="16" y="18" width="152" height="62" rx="6" fill="#0A0E14" stroke="#30363D"/>
    <rect x="16" y="18" width="152" height="18" rx="6" fill="#161B22"/>
    <circle cx="27" cy="27" r="3" fill="#FF5F56"/>
    <circle cx="38" cy="27" r="3" fill="#FFBD2E"/>
    <circle cx="49" cy="27" r="3" fill="#27C93F"/>
    <text x="92" y="30.5" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#8B949E" letter-spacing="1">ac1</text>
    <text x="27" y="52" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#00E3A8">$ claude</text>
    <text x="27" y="66" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#6E7681">~/.claude-ac1</text>
  </g>

  <!-- window ac2 -->
  <g>
    <rect x="212" y="18" width="152" height="62" rx="6" fill="#0A0E14" stroke="#30363D"/>
    <rect x="212" y="18" width="152" height="18" rx="6" fill="#161B22"/>
    <circle cx="223" cy="27" r="3" fill="#FF5F56"/>
    <circle cx="234" cy="27" r="3" fill="#FFBD2E"/>
    <circle cx="245" cy="27" r="3" fill="#27C93F"/>
    <text x="288" y="30.5" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#8B949E" letter-spacing="1">ac2</text>
    <text x="223" y="52" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#79C0FF">$ opencode</text>
    <text x="223" y="66" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#6E7681">~/.config/oc-ac2</text>
  </g>

  <!-- connector lines to shared context -->
  <path d="M92 80 C 92 110, 150 108, 178 128" fill="none" stroke="#00E3A8" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.75"/>
  <path d="M288 80 C 288 110, 230 108, 202 128" fill="none" stroke="#79C0FF" stroke-width="1.4" stroke-dasharray="3 3" opacity="0.75"/>

  <!-- shared context node -->
  <g filter="url(#glow)">
    <rect x="130" y="130" width="120" height="46" rx="8" fill="#1C2230" stroke="#00E3A8" stroke-width="1.2"/>
  </g>
  <text x="190" y="150" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="#00E3A8" letter-spacing="1.5">SHARED CONTEXT</text>
  <text x="190" y="164" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="8.5" fill="#E6EDF3">CLAUDE.md &#183; rules/*</text>

  <!-- provider row -->
  <text x="190" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="8" fill="#6E7681" letter-spacing="1">ANTHROPIC &#183; GLM &#183; BEDROCK &#183; LOCAL</text>
</svg>
