<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">The Same Rig Over the Internet — Tailnet</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Part 2 in one picture: the tailnet replaces "same WiFi" — VNC keeps believing it's on a LAN, and no router port ever opens</text>

  <!-- Phone panel -->
  <rect x="30" y="90" width="290" height="380" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Phone — anywhere</text>
  <text x="175" y="140" text-anchor="middle" font-size="11" fill="#6b7280">café WiFi · hotel · mobile data</text>

  <rect x="55" y="160" width="240" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">RealVNC Viewer</text>
  <text x="175" y="206" text-anchor="middle" font-size="11" fill="#1e40af">unchanged app — dials the</text>
  <text x="175" y="222" text-anchor="middle" font-size="11" fill="#1e40af">desktop's tailnet IP, port 5900</text>

  <rect x="55" y="270" width="240" height="80" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="175" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">Tailscale (WireGuard)</text>
  <text x="175" y="316" text-anchor="middle" font-size="11" fill="#047857">phone gets a permanent</text>
  <text x="175" y="332" text-anchor="middle" font-size="11" fill="#047857">100.x.y.z tailnet address</text>

  <rect x="55" y="380" width="240" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="175" y="404" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">CGNAT? Doesn't matter</text>
  <text x="175" y="422" text-anchor="middle" font-size="10.5" fill="#6b7280">outbound-only — NAT traversal built in</text>

  <!-- Desktop panel -->
  <rect x="660" y="90" width="290" height="380" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="805" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Desktop — at home</text>
  <text x="805" y="140" text-anchor="middle" font-size="11" fill="#6b7280">Mac or Ubuntu, behind your router</text>

  <rect x="685" y="160" width="240" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="805" y="186" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">VNC server — unchanged</text>
  <text x="805" y="206" text-anchor="middle" font-size="11" fill="#1e40af">Screen Sharing / x11vnc,</text>
  <text x="805" y="222" text-anchor="middle" font-size="11" fill="#1e40af">same port, same VNC password</text>

  <rect x="685" y="270" width="240" height="80" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="805" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">Tailscale (WireGuard)</text>
  <text x="805" y="316" text-anchor="middle" font-size="11" fill="#047857">desktop gets its own permanent</text>
  <text x="805" y="332" text-anchor="middle" font-size="11" fill="#047857">100.x.y.z tailnet address</text>

  <rect x="685" y="380" width="240" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="805" y="404" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">ufw stays scoped</text>
  <text x="805" y="422" text-anchor="middle" font-size="10.5" fill="#6b7280">allow from 100.64.0.0/10 → 5900</text>

  <!-- Middle: direct + DERP -->
  <rect x="360" y="110" width="260" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="490" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">Direct WireGuard tunnel</text>
  <text x="490" y="158" text-anchor="middle" font-size="11" fill="#047857">the common case — peers punch</text>
  <text x="490" y="174" text-anchor="middle" font-size="11" fill="#047857">through their own NATs and talk</text>
  <text x="490" y="190" text-anchor="middle" font-size="11" fill="#047857">end-to-end encrypted, peer to peer</text>
  <text x="490" y="216" text-anchor="middle" font-size="10.5" fill="#15803d">~66 ms verified live, phone on cellular</text>
  <text x="490" y="236" text-anchor="middle" font-size="10.5" fill="#15803d">tailscale status → "direct"</text>

  <rect x="360" y="300" width="260" height="130" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="490" y="328" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">DERP relay — fallback only</text>
  <text x="490" y="348" text-anchor="middle" font-size="11" fill="#6b7280">when no direct path can be punched:</text>
  <text x="490" y="364" text-anchor="middle" font-size="11" fill="#6b7280">encrypted packets relayed through</text>
  <text x="490" y="380" text-anchor="middle" font-size="11" fill="#6b7280">Tailscale's servers — ciphertext only,</text>
  <text x="490" y="396" text-anchor="middle" font-size="11" fill="#6b7280">the relay can't read a byte</text>
  <text x="490" y="418" text-anchor="middle" font-size="10.5" fill="#9ca3af">slower: extra hop — check tailscale status</text>

  <!-- arrows phone <-> middle -->
  <line x1="320" y1="200" x2="355" y2="185" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="355" y1="230" x2="320" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- arrows middle <-> desktop -->
  <line x1="620" y1="185" x2="655" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <line x1="655" y1="215" x2="620" y2="230" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- DERP dashed arrows -->
  <line x1="320" y1="310" x2="355" y2="345" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="655" y1="310" x2="620" y2="345" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- router note -->
  <rect x="430" y="460" width="120" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="490" y="479" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Router: closed</text>
  <text x="490" y="495" text-anchor="middle" font-size="10" fill="#b91c1c">zero ports forwarded</text>

  <text x="490" y="540" text-anchor="middle" font-size="11" fill="#9ca3af">Setup delta vs. same-network rig: two apps installed, one firewall rule, one edited IP — a re-addressing, not a rebuild</text>
</svg>
