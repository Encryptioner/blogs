<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">The RFB Handshake — What a VNC Session Actually Says</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#6b7280">RFC 6143, the whole conversation — step 3 is where the 8-character password cap lives</text>

  <!-- lifelines -->
  <rect x="150" y="80" width="200" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">VNC client (phone)</text>
  <line x1="250" y1="120" x2="250" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="630" y="80" width="200" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">VNC server (desktop)</text>
  <line x1="730" y1="120" x2="730" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Step 1: version handshake -->
  <line x1="250" y1="160" x2="730" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="490" y="152" text-anchor="middle" font-size="11.5" fill="#2563eb">① "RFB 003.008" — version handshake</text>
  <line x1="730" y1="185" x2="250" y2="185" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowBlue)"/>
  <text x="490" y="177" text-anchor="middle" font-size="11" fill="#3b82f6">"RFB 003.008" — agree on a version</text>

  <!-- Step 2: security negotiation -->
  <line x1="730" y1="230" x2="250" y2="230" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="490" y="222" text-anchor="middle" font-size="11.5" fill="#d97706">② server lists auth types it accepts</text>
  <text x="490" y="246" text-anchor="middle" font-size="10.5" fill="#b45309">macOS serves TWO at once: Mac-account (ARD) + legacy VNC password</text>
  <line x1="250" y1="275" x2="730" y2="275" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="490" y="267" text-anchor="middle" font-size="11" fill="#b45309">client picks one — the wrong pick = "correct password rejected" loop</text>

  <!-- Step 3: DES challenge-response -->
  <line x1="730" y1="320" x2="250" y2="320" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="490" y="312" text-anchor="middle" font-size="11.5" fill="#7c3aed">③ 16-byte challenge (DES challenge-response)</text>
  <line x1="250" y1="360" x2="730" y2="360" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="490" y="352" text-anchor="middle" font-size="11" fill="#6d28d9">client encrypts it with the PASSWORD as the DES key</text>

  <!-- the cap callout -->
  <rect x="330" y="378" width="320" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="490" y="400" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">DES keys are 8 bytes → characters past 8</text>
  <text x="490" y="418" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">never enter the computation. First 8 = the password.</text>

  <!-- Step 4: session stream -->
  <line x1="250" y1="460" x2="730" y2="460" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="490" y="452" text-anchor="middle" font-size="11.5" fill="#2563eb">④ framebuffer negotiated — then the session stream:</text>

  <rect x="120" y="486" width="340" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">server → client: framebuffer updates</text>
  <text x="290" y="522" text-anchor="middle" font-size="10" fill="#3b82f6">the pixels of the desktop you see</text>

  <rect x="520" y="486" width="340" height="48" rx="8" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="690" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">client → server: pointer + key events</text>
  <text x="690" y="522" text-anchor="middle" font-size="10" fill="#6d28d9">every tap and keystroke you send</text>
</svg>
