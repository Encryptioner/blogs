<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">NAT Hole-Punching — How Two Firewalled Devices Find Each Other</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#6b7280">The generic rendezvous trick Tailscale's coordination plane runs before falling back to DERP</text>

  <!-- lifelines -->
  <rect x="90" y="80" width="170" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Peer A (phone)</text>
  <line x1="175" y1="120" x2="175" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="175" y="490" text-anchor="middle" font-size="10.5" fill="#6b7280">behind NAT (mobile carrier)</text>

  <rect x="405" y="80" width="170" height="40" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Rendezvous server</text>
  <line x1="490" y1="120" x2="490" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="490" y="490" text-anchor="middle" font-size="10.5" fill="#6b7280">coordination plane — public keys only</text>

  <rect x="720" y="80" width="170" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="805" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Peer B (desktop)</text>
  <line x1="805" y1="120" x2="805" y2="470" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="805" y="490" text-anchor="middle" font-size="10.5" fill="#6b7280">behind NAT (home router)</text>

  <!-- 1: both contact rendezvous -->
  <line x1="175" y1="160" x2="490" y2="160" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="332" y="152" text-anchor="middle" font-size="11" fill="#d97706">① "here I am" — outbound, so each NAT lets it out</text>

  <line x1="805" y1="190" x2="490" y2="190" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="647" y="182" text-anchor="middle" font-size="11" fill="#d97706">same from B</text>

  <!-- 2: server tells each the other's observed address -->
  <line x1="490" y1="230" x2="175" y2="230" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <text x="332" y="222" text-anchor="middle" font-size="11" fill="#b45309">② "B is at addr:port" (as your NAT shows it)</text>

  <line x1="490" y1="262" x2="805" y2="262" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <text x="647" y="254" text-anchor="middle" font-size="11" fill="#b45309">"A is at addr:port"</text>

  <!-- 3: simultaneous exchange -->
  <line x1="175" y1="320" x2="805" y2="320" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="490" y="312" text-anchor="middle" font-size="11.5" fill="#16a34a">③ both send at each other simultaneously</text>
  <text x="490" y="336" text-anchor="middle" font-size="10.5" fill="#15803d">A's outbound packet opens a pinhole in A's NAT…</text>

  <line x1="805" y1="370" x2="175" y2="370" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="490" y="362" text-anchor="middle" font-size="10.5" fill="#15803d">…and B's outbound packet opens a pinhole in B's NAT —</text>
  <text x="490" y="386" text-anchor="middle" font-size="10.5" fill="#15803d">each side's packets slip through the hole the other just opened</text>

  <!-- 4: direct established -->
  <rect x="300" y="408" width="380" height="48" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="428" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">④ direct path established — rendezvous server out of the loop</text>
  <text x="490" y="446" text-anchor="middle" font-size="10.5" fill="#047857">encrypted WireGuard packets, peer to peer, end to end</text>

  <text x="490" y="530" text-anchor="middle" font-size="11.5" fill="#6b7280">If both NATs are too strict for pinholes → fallback: DERP relay carries the same encrypted packets, one extra hop</text>
  <text x="490" y="548" text-anchor="middle" font-size="11" fill="#9ca3af">Check which path you're on: tailscale status → "direct" or "relay …"</text>
</svg>
