<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Same Rig, Any Network — the Tailnet</text>
  <text x="490" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Part 3: neither device knows where the other physically is — VNC and DroidCam see a LAN</text>

  <!-- DERP relay box (top middle) -->
  <rect x="395" y="90" width="190" height="66" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="490" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">DERP relay (fallback)</text>
  <text x="490" y="136" text-anchor="middle" font-size="10.5" fill="#6b7280">carries ciphertext only —</text>
  <text x="490" y="150" text-anchor="middle" font-size="10.5" fill="#6b7280">used when direct fails</text>

  <!-- Phone panel -->
  <rect x="30" y="90" width="270" height="420" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Android Phone</text>
  <text x="165" y="141" text-anchor="middle" font-size="11" fill="#6b7280">café WiFi / mobile data — anywhere</text>

  <rect x="55" y="160" width="220" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="165" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">RealVNC Viewer</text>
  <text x="165" y="204" text-anchor="middle" font-size="11" fill="#1e40af">target = desktop's tailnet IP</text>
  <text x="165" y="222" text-anchor="middle" font-size="10.5" fill="#3b82f6">same app, same VNC password</text>

  <rect x="55" y="265" width="220" height="70" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="165" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">DroidCam app</text>
  <text x="165" y="309" text-anchor="middle" font-size="11" fill="#047857">streams mic to desktop's</text>
  <text x="165" y="325" text-anchor="middle" font-size="11" fill="#047857">tailnet IP, port 4747</text>

  <rect x="55" y="360" width="220" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="165" y="385" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">Tailscale app — ON</text>
  <text x="165" y="404" text-anchor="middle" font-size="11" fill="#6b7280">phone gets a permanent</text>
  <text x="165" y="420" text-anchor="middle" font-size="11" fill="#6b7280">100.x.y.z address</text>

  <!-- Desktop panel -->
  <rect x="680" y="90" width="270" height="420" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="815" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Desktop at Home</text>
  <text x="815" y="141" text-anchor="middle" font-size="11" fill="#6b7280">behind router / possibly CGNAT</text>

  <rect x="705" y="160" width="220" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="815" y="185" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">x11vnc — unchanged</text>
  <text x="815" y="204" text-anchor="middle" font-size="11" fill="#1e40af">same flags, same password,</text>
  <text x="815" y="222" text-anchor="middle" font-size="10.5" fill="#3b82f6">port 5900 on the tailnet</text>

  <rect x="705" y="265" width="220" height="70" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="815" y="290" text-anchor="middle" font-size="13.5" font-weight="700" fill="#065f46">DroidCam client</text>
  <text x="815" y="309" text-anchor="middle" font-size="11" fill="#047857">droidcam-cli -a &lt;phone-tailnet-ip&gt;</text>
  <text x="815" y="325" text-anchor="middle" font-size="11" fill="#047857">port 4747, same flag order</text>

  <rect x="705" y="360" width="220" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="815" y="385" text-anchor="middle" font-size="12.5" font-weight="700" fill="#374151">Tailscale — ON</text>
  <text x="815" y="404" text-anchor="middle" font-size="11" fill="#6b7280">desktop gets its permanent</text>
  <text x="815" y="420" text-anchor="middle" font-size="11" fill="#6b7280">100.x.y.z address</text>

  <!-- Direct path (straight, lower) -->
  <line x1="300" y1="480" x2="680" y2="480" stroke="#2563eb" stroke-width="2.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <text x="490" y="466" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563eb">direct WireGuard tunnel — the common case</text>
  <text x="490" y="502" text-anchor="middle" font-size="10.5" fill="#6b7280">encrypted end-to-end, peer to peer — NAT pinholes opened on both sides</text>

  <!-- DERP path (up through relay, dashed) -->
  <line x1="300" y1="395" x2="440" y2="163" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <line x1="540" y1="163" x2="680" y2="395" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <text x="490" y="540" text-anchor="middle" font-size="11" fill="#9ca3af">No router ports opened, no public IP needed — the tailnet replaces "same WiFi" as the trust boundary</text>
</svg>
